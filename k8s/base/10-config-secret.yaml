apiVersion: v1
kind: ConfigMap
metadata:
  name: lp-config
  namespace: learning-platform
data:
  LOG_LEVEL: "INFO"
---
# DEMO ONLY: in real environments use Sealed Secrets / External Secrets / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: lp-secret
  namespace: learning-platform
type: Opaque
stringData:
  POSTGRES_USER: lp
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: learning
  DATABASE_URL: postgresql://lp:change-me@postgres:5432/learning
