apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-platform
  namespace: learning-platform
  labels: {app: learning-platform}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: learning-platform}
  template:
    metadata:
      labels: {app: learning-platform}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: ghcr.io/shlokgour/learning-platform:latest   # replace shlokgour (CD overrides the tag)
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: lp-config}
            - secretRef: {name: lp-secret}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: learning-platform
  namespace: learning-platform
spec:
  selector: {app: learning-platform}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: learning-platform
  namespace: learning-platform
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: learning-platform}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: learning-platform
  namespace: learning-platform
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: learning-platform}
