apiVersion: v1
kind: Service
metadata:
  name: lp-live
  namespace: learning-platform
spec:
  selector: {app: lp, slot: blue}   # switched by scripts/bluegreen-deploy.sh
  ports: [{port: 80, targetPort: 8000}]
---
# Preview service to smoke-test the idle slot before cutover
apiVersion: v1
kind: Service
metadata:
  name: lp-preview
  namespace: learning-platform
spec:
  selector: {app: lp, slot: green}
  ports: [{port: 80, targetPort: 8000}]
