name: CD

# Deploys the image built by CI (tag = commit SHA) to Kubernetes.
# develop -> staging (rolling update) | main -> production (blue-green, manual approval)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

jobs:
  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube && echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
      - name: Rolling deploy
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          kubectl apply -f k8s/base/
          kubectl -n learning-platform set image deployment/learning-platform app=$IMAGE
          kubectl -n learning-platform rollout status deployment/learning-platform --timeout=180s

  deploy-production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube && echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
      - name: Blue-green release
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }} \
          ./scripts/bluegreen-deploy.sh
